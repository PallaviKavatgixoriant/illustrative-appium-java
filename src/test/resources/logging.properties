# External logging configuration.
# ScenarioLogger installs the same format itself so the first test run
# does not depend on JUL starting before the test classes are loaded.
# Format: timestamp, level, thread, message.

handlers=java.util.logging.ConsoleHandler
.level=INFO
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=com.illustrative.appium.support.TimestampFormatter
com.illustrative.appium.level=INFO
