# The suite class starts Cucumber. This line stops Cucumber from also
# discovering the same feature files a second time as a root engine.
cucumber.junit-platform.discovery.as-root-engine=false

# Scenarios on ONE device stay one-after-another.
# Android and iOS run together as two separate Maven processes, each with its own device.
# Turning this on shares one device across scenarios and makes the run flaky.
cucumber.execution.parallel.enabled=false

# After each thread has its own device, cross-scenario parallel on ONE platform can look like this:
# cucumber.execution.parallel.enabled=true
# cucumber.execution.parallel.config.strategy=fixed
# cucumber.execution.parallel.config.fixed.parallelism=2
# cucumber.execution.parallel.config.fixed.max-pool-size=2
